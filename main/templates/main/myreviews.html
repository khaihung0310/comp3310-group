{% extends 'main/base.html' %}

{% block content %}

<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card">
        <div class="card-body">
          <h1 class="card-title text-center">My Reviews</h1>
          {% if reviews %}
            {% for review in reviews %}
              <div class="card mb-3">
                <div class="card-body">
                  <h5 class="card-title">
                    <a href="{% url 'main:details' review.movie.id %}">{{ review.movie.name }}</a>
                  </h5>
                  <p class="card-text">{{ review.comment }}</p>
                  <p class="card-text"><b>Rating: {{ review.rating }}</b></p>
                  <a href="{% url 'main:edit_review' review.id %}" class="btn btn-primary btn-sm d-inline-block">Edit Review</a>
                </div>
              </div>
            {% endfor %}
          {% else %}
            <p>You have not written any reviews yet.</p>
          {% endif %}
        </div>
      </div>
    </div>
  </div>
</div>

{% endblock %}
