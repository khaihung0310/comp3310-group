{% extends 'main/base.html' %}
{% load crispy_forms_tags %}

{% block content %}

<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card">
        <div class="card-body">
          <h1 class="card-title text-center">Edit Review</h1>
          <p class="text-center">
            <a href="{% url 'main:details' review.movie.id %}">{{ review.movie.name }}</a>
          </p>
          <form method="POST">
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="btn btn-primary">Save Review</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

{% endblock %}
